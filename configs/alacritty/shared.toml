# Shared Alacritty look (Ghostty-parity). No [shell] here — panes stay plain bash.

[env]
TERM = "xterm-256color"

[window]
padding.x = 16
padding.y = 14
decorations = "None"
opacity = 0.98
dynamic_title = true

[scrolling]
history = 10000

[cursor]
style = "Block"
blink_interval = 550

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" }
]
