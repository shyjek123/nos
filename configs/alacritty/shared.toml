[env]
TERM = "xterm-256color"

# New windows attach to one session and create it only if it is missing.
# Another session you named: alacritty -e zellij attach --create <name>
[shell]
program = "zellij"
args = ["attach", "--create", "default"]

[window]
padding.x = 16
padding.y = 14
decorations = "None"
opacity = 0.98

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" }
]
