# Main interactive terminal — Zellij session "default" (create or attach)
import = [
  "~/.config/alacritty/theme.toml",
  "~/.config/alacritty/font.toml",
  "~/.config/alacritty/font-size.toml",
  "~/.config/alacritty/shared.toml",
]

[shell]
program = "zellij"
args = ["attach", "--create", "default"]
