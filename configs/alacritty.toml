# Main interactive terminal — plain shell, NOS rice via imports.
# No custom [shell]: Alacritty uses its default shell. Zellij is manual-only.

[general]
import = [
  "~/.config/alacritty/theme.toml",
  "~/.config/alacritty/font.toml",
  "~/.config/alacritty/font-size.toml",
  "~/.config/alacritty/shared.toml",
]
