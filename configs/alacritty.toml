# Main interactive terminal — starts NOS Zellij wrapper (session "default")
# Use [general].import for Alacritty 0.13+; migrate keeps older formats working.

[general]
import = [
  "~/.config/alacritty/theme.toml",
  "~/.config/alacritty/font.toml",
  "~/.config/alacritty/font-size.toml",
  "~/.config/alacritty/shared.toml",
]

[shell]
program = "/bin/bash"
args = ["-lc", "exec \"$HOME/.local/share/nos/bin/nos-zellij.sh\""]
