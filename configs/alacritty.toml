# Main interactive terminal — Zellij session "default" via nos-zellij.
# Absolute path + bash fallback so a missing wrapper never blink-closes Alacritty.

[general]
import = [
  "~/.config/alacritty/theme.toml",
  "~/.config/alacritty/font.toml",
  "~/.config/alacritty/font-size.toml",
  "~/.config/alacritty/shared.toml",
]

[shell]
program = "/bin/bash"
args = [
  "--noprofile",
  "--norc",
  "-c",
  "export PATH=\"$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH\"; if [ -x \"$HOME/.local/bin/nos-zellij\" ]; then exec \"$HOME/.local/bin/nos-zellij\"; fi; if command -v nos-zellij >/dev/null 2>&1; then exec nos-zellij; fi; exec /bin/bash -l",
]
