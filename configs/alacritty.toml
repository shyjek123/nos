# Main interactive terminal — Zellij session "default" via nos-zellij
# Wrapper is linked to ~/.local/bin/nos-zellij by app-alacritty.sh

[general]
import = [
  "~/.config/alacritty/theme.toml",
  "~/.config/alacritty/font.toml",
  "~/.config/alacritty/font-size.toml",
  "~/.config/alacritty/shared.toml",
]

[shell]
program = "/bin/bash"
args = ["--noprofile", "--norc", "-c", "export PATH=\"$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH\"; exec nos-zellij"]
