[window]
# window padding {px}
padding.x = 12
padding.y = 12

[font]
size = 12.0



[colors]
[colors.primary]
background = "#121212"
foreground = "#bebebe"
dim_foreground = "#8a8a8d"

[colors.cursor]
text = "#121212"
cursor = "#eaeaea"

[colors.vi_mode_cursor]
text = "#121212"
cursor = "#eaeaea"

[colors.selection]
text = "CellForeground"
background = "#333333"

[colors.normal]
black = "#333333"
red = "#e15d5d"
green = "#9aaa6a"
yellow = "#f0d060"
blue = "#e0922a"
magenta = "#d47aa8"
cyan = "#8eb8b8"
white = "#d0d0d0"

[colors.bright]
black = "#6a6a6a"
red = "#ff8a8a"
green = "#c6d48a"
yellow = "#ffe38a"
blue = "#ffb03a"
magenta = "#f0a8c8"
cyan = "#b8e0e0"
white = "#ffffff"